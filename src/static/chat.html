<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inspect-k8s 채팅</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --ink: #1c2733; --muted: #5b6b7b;
    --accent: #2563eb; --accent-ink: #ffffff; --line: #dde4ea;
    --ok: #0f766e; --warn: #b45309; --bad: #b91c1c; --chip: #eef2f6;
    --side: #eef2f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161d; --panel: #1a232e; --ink: #e6edf3; --muted: #93a4b4;
      --accent: #3b82f6; --line: #2c3947; --chip: #223041; --side: #141c26;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Noto Sans KR", "Segoe UI", sans-serif;
    display: flex; height: 100dvh;
  }
  /* ---- 세션 사이드바 ---- */
  aside {
    width: 250px; flex-shrink: 0; background: var(--side);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  aside .brand { padding: 14px 16px 8px; font-weight: 700; font-size: 15px; }
  aside .newBtn {
    margin: 6px 12px 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer;
    border: 1px dashed var(--muted); background: transparent; color: var(--ink);
    font: inherit; font-size: 13px; text-align: left;
  }
  aside .newBtn:hover { border-color: var(--accent); color: var(--accent); }
  #sessions { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
  .sess {
    position: relative; padding: 8px 26px 8px 10px; border-radius: 10px;
    cursor: pointer; margin-bottom: 2px;
  }
  .sess:hover { background: var(--chip); }
  .sess.active { background: var(--panel); border: 1px solid var(--line); }
  .sess .t { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .m { font-size: 11px; color: var(--muted); }
  .sess .del {
    position: absolute; right: 6px; top: 8px; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 12px; display: none; padding: 2px 4px;
  }
  .sess:hover .del { display: block; }
  .sess .del:hover { color: var(--bad); }
  .sess .del.arm { display: block; color: var(--bad); font-weight: 700; }
  /* ---- 에이전트/도구 패널 ---- */
  .section-label {
    padding: 10px 16px 4px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; border-top: 1px solid var(--line);
  }
  #agents { padding: 0 8px 6px; }
  .agentItem { padding: 7px 10px; border-radius: 10px; cursor: pointer; margin-bottom: 2px; }
  .agentItem:hover { background: var(--chip); }
  .agentItem.active { background: var(--panel); border: 1px solid var(--accent); }
  .agentItem .t { font-size: 13px; font-weight: 600; }
  .agentItem.active .t { color: var(--accent); }
  .agentItem .d { font-size: 11px; color: var(--muted); }
  #toolsBox { margin: 4px 12px 14px; font-size: 12px; color: var(--muted); }
  #toolsBox summary { cursor: pointer; padding: 4px 0; }
  #tools { max-height: 180px; overflow-y: auto; padding: 4px 0 0 4px; }
  #tools div { padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tools b { color: var(--ink); font-weight: 600; }
  /* ---- 메인 ---- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 12px 18px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--chip); color: var(--muted);
  }
  header .badge.model { color: var(--accent); font-weight: 600; }
  select.badge { border: 1px solid var(--line); cursor: pointer; outline: none; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .agent pre, .agent code { background: var(--chip); border-radius: 6px; padding: 1px 5px; font-size: 13px; overflow-x: auto; }
  .agent pre { padding: 8px 10px; }
  .event {
    align-self: flex-start; font-size: 12.5px; color: var(--muted);
    background: var(--chip); border-radius: 10px; padding: 5px 10px;
    display: flex; align-items: center; gap: 6px; max-width: 78%;
  }
  .event .st-허용 { color: var(--ok); font-weight: 600; }
  .event .st-거부 { color: var(--bad); font-weight: 600; }
  .event .st-오류 { color: var(--warn); font-weight: 600; }
  .event.error { color: var(--bad); background: transparent; border: 1px solid var(--bad); }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding-left: 4px; }
  form {
    display: flex; gap: 10px; padding: 12px 18px 16px; background: var(--panel);
    border-top: 1px solid var(--line);
  }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--ink); padding: 10px 12px; font: inherit;
    max-height: 130px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  form button {
    border: 0; background: var(--accent); color: var(--accent-ink);
    border-radius: 12px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }
  @media (max-width: 720px) { aside { display: none; } }
  /* ---- 오버레이 편집기 (위키·에이전트 공용) ---- */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  #overlay[hidden] { display: none; }
  .ovPanel {
    width: min(1000px, 92vw); height: min(680px, 88vh); background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; display: flex; overflow: hidden;
  }
  .ovSide {
    width: 240px; flex-shrink: 0; border-right: 1px solid var(--line);
    background: var(--side); overflow-y: auto; padding: 10px 8px;
  }
  .ovSide .sec { font-size: 11px; color: var(--muted); padding: 8px 8px 3px; text-transform: uppercase; }
  .ovSide .item { padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ovSide .item:hover { background: var(--chip); }
  .ovSide .item.active { background: var(--panel); border: 1px solid var(--line); }
  .ovMain { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .ovHead { display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .ovHead .spacer { flex: 1; }
  .ovHead button {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 8px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .ovHead button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #ovStatus { padding: 4px 14px; font-size: 12px; color: var(--muted); min-height: 22px; }
  #ovStatus input {
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
    color: var(--ink); padding: 3px 8px; font: inherit; font-size: 12px;
  }
  #ovText {
    flex: 1; border: 0; outline: none; resize: none; padding: 12px 14px;
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .agentItem { position: relative; padding-right: 26px; }
  .agentItem .edit {
    position: absolute; right: 6px; top: 7px; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 4px;
  }
  .agentItem .edit:hover { color: var(--accent); }
</style>
</head>
<body>
<aside>
  <div class="brand">🔍 inspect-k8s</div>
  <button class="newBtn" id="newSession" type="button">＋ 새 세션</button>
  <div id="sessions"></div>
  <div class="section-label">에이전트 · 스킬</div>
  <div id="agents"></div>
  <button class="newBtn" id="newAgentBtn" type="button">＋ 새 에이전트·스킬</button>
  <div class="section-label">지식 · 진화</div>
  <button class="newBtn" id="wikiBtn" type="button">📚 위키 보기·편집</button>
  <button class="newBtn" id="reflectBtn" type="button">🧬 이 세션에서 배우기</button>
  <details id="toolsBox">
    <summary>🛠 사용 가능한 도구</summary>
    <div id="tools"></div>
  </details>
</aside>

<div id="overlay" hidden>
  <div class="ovPanel">
    <div class="ovSide" id="ovList"></div>
    <div class="ovMain">
      <div class="ovHead">
        <span id="ovTitle">…</span>
        <span class="spacer"></span>
        <button id="ovSave" class="primary" type="button">저장</button>
        <button id="ovClose" type="button">닫기</button>
      </div>
      <div id="ovStatus"></div>
      <textarea id="ovText" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<main>
  <header>
    <span class="badge">read-only</span>
    <span class="badge" id="target" title="조사 대상 클러스터"></span>
    <select class="badge" id="ctxSel" title="조사할 클러스터 선택" hidden></select>
    <span class="badge model" id="model">…</span>
    <select class="badge" id="effortSel" title="추론 모드 (fast/ultra는 정책상 배제)" hidden></select>
    <span class="badge" id="agentBadge">inspector</span>
    <span class="badge" id="thread"></span>
    <span class="badge" id="sessTokens" title="현재 세션 누적 토큰 (in+out)"></span>
  </header>

  <div id="log"></div>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="예: default 네임스페이스에서 CrashLoopBackOff 상태인 파드 찾아줘  (Enter 전송 · Shift+Enter 줄바꿈)"></textarea>
    <button id="send" type="submit">전송</button>
  </form>
</main>

<script>
"use strict";
const log = document.getElementById("log");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const sessionsEl = document.getElementById("sessions");

let threadId = localStorage.getItem("inspect-k8s-thread") || null;
let activeAgent = "inspector";
let agentDefs = [];
let usageChip = null;   // 현재 턴의 토큰 사용량 표시 요소 (usage 이벤트마다 갱신)

function fmtTk(n) {
  n = n || 0;
  return n >= 10000 ? (n / 1000).toFixed(1) + "k" : n.toLocaleString();
}

function setThreadBadge() {
  document.getElementById("thread").textContent = "세션 " + (threadId || "…");
}
function setAgent(name) {
  activeAgent = name;
  document.getElementById("agentBadge").textContent = "🤖 " + name;
  renderAgents();
}

let reasoningEffort = localStorage.getItem("inspect-k8s-effort") || "";
let kubeContext = localStorage.getItem("inspect-k8s-context") || "";

fetch("/api/health").then(r => r.json()).then(h => {
  document.getElementById("model").textContent = h.model;
  const tgt = document.getElementById("target");
  const opts = h.context_options || [];
  if (tgt) {
    tgt.textContent = (h.real_cluster ? "🌐 실" : "🧪 샌드박스") + (opts.length ? "" : " " + (h.context || ""));
    tgt.style.color = h.real_cluster ? "var(--warn)" : "var(--muted)";
  }
  const csel = document.getElementById("ctxSel");
  if (opts.length && csel) {
    csel.hidden = false;
    if (!opts.includes(kubeContext)) kubeContext = h.context;
    for (const name of opts) {
      const o = document.createElement("option");
      o.value = name;
      o.textContent = name;
      if (name === kubeContext) o.selected = true;
      csel.appendChild(o);
    }
    csel.addEventListener("change", () => {
      kubeContext = csel.value;
      localStorage.setItem("inspect-k8s-context", kubeContext);
      addEvent("🌐 조사 대상 클러스터 전환: " + kubeContext + " (다음 질의부터 적용)");
    });
  }
  const sel = document.getElementById("effortSel");
  if ((h.reasoning_options || []).length) {
    sel.hidden = false;
    if (!h.reasoning_options.includes(reasoningEffort)) reasoningEffort = h.reasoning_effort;
    for (const opt of h.reasoning_options) {
      const o = document.createElement("option");
      o.value = opt;
      o.textContent = "추론 " + opt + (opt === h.reasoning_effort ? " (기본)" : "");
      if (opt === reasoningEffort) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener("change", () => {
      reasoningEffort = sel.value;
      localStorage.setItem("inspect-k8s-effort", reasoningEffort);
      addEvent("🧠 추론 모드 변경: " + reasoningEffort + " (다음 질의부터 적용)");
    });
  }
}).catch(() => {});

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  log.appendChild(node);
  log.scrollTop = log.scrollHeight;
  return node;
}
function addEvent(text) { return el("div", "event", text); }

function addToolResult(name, status, preview) {
  const node = el("div", "event");
  const badge = document.createElement("span");
  badge.className = "st-" + status;
  badge.textContent = status;
  node.append("🛠 " + name + " → ");
  node.appendChild(badge);
  if (status !== "허용" && preview) node.append(" · " + preview.slice(0, 160));
  log.scrollTop = log.scrollHeight;
}

function renderAgent(text) {
  const node = el("div", "msg agent");
  const parts = text.split(/```/);
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const pre = document.createElement("pre");
      pre.textContent = part.replace(/^[a-z]*\n/, "");
      node.appendChild(pre);
    } else {
      part.split(/(`[^`]+`)/).forEach(seg => {
        if (seg.startsWith("`") && seg.endsWith("`")) {
          const code = document.createElement("code");
          code.textContent = seg.slice(1, -1);
          node.appendChild(code);
        } else if (seg) {
          node.appendChild(document.createTextNode(seg));
        }
      });
    }
  });
  log.scrollTop = log.scrollHeight;
}

// ---------- 에이전트/도구 카탈로그 ----------

function renderAgents() {
  const box = document.getElementById("agents");
  box.innerHTML = "";
  for (const a of agentDefs) {
    const item = document.createElement("div");
    item.className = "agentItem" + (a.name === activeAgent ? " active" : "");
    const t = document.createElement("div");
    t.className = "t";
    t.textContent = "🤖 " + a.name + (a.source === "builtin" ? "" : " ·  " + a.source);
    const d = document.createElement("div");
    d.className = "d";
    d.textContent = a.description || "";
    item.append(t, d);
    item.title = "이 세션의 에이전트로 선택";
    item.addEventListener("click", () => {
      setAgent(a.name);
      addEvent("🤖 에이전트 전환: " + a.name + (a.description ? " — " + a.description : ""));
    });
    const edit = document.createElement("button");
    edit.className = "edit";
    edit.textContent = "✎";
    edit.title = "정의(지시문/스킬) 보기·편집";
    edit.addEventListener("click", (e) => { e.stopPropagation(); openAgentEditor(a.name); });
    item.appendChild(edit);
    box.appendChild(item);
  }
}

async function loadAgents() {
  const res = await fetch("/api/agents");
  const data = await res.json();
  agentDefs = data.agents || [];
  renderAgents();
  const toolsEl = document.getElementById("tools");
  document.querySelector("#toolsBox summary").textContent =
    "🛠 사용 가능한 도구 (" + (data.tools || []).length + " · 전부 read-only)";
  toolsEl.innerHTML = "";
  for (const t of data.tools || []) {
    const row = document.createElement("div");
    const b = document.createElement("b");
    b.textContent = t.name;
    row.appendChild(b);
    row.append(" · " + t.verb);
    row.title = t.description;
    toolsEl.appendChild(row);
  }
}

// ---------- 오버레이 편집기 (위키·에이전트 공용) ----------

const overlay = document.getElementById("overlay");
const ovList = document.getElementById("ovList");
const ovTitle = document.getElementById("ovTitle");
const ovStatus = document.getElementById("ovStatus");
const ovText = document.getElementById("ovText");
let ovCtx = null;   // {kind: "wiki"|"agent"|"agent-new", path?, name?}

function ovStatusMsg(text, isError) {
  ovStatus.textContent = text || "";
  ovStatus.style.color = isError ? "var(--bad)" : "var(--muted)";
}

document.getElementById("ovClose").addEventListener("click", () => { overlay.hidden = true; });
overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.hidden = true; });

async function openWiki() {
  overlay.hidden = false;
  ovCtx = null;
  ovTitle.textContent = "📚 위키 (장기 기억)";
  ovText.value = "";
  ovStatusMsg("왼쪽에서 페이지를 선택하세요 — 저장 시 레다크션 필터가 적용됩니다");
  const data = await (await fetch("/api/wiki")).json();
  ovList.innerHTML = "";
  for (const [section, pages] of Object.entries(data.sections || {})) {
    const sec = document.createElement("div");
    sec.className = "sec";
    sec.textContent = section;
    ovList.appendChild(sec);
    for (const p of pages) {
      const item = document.createElement("div");
      item.className = "item";
      item.textContent = p.name + (p.hint ? " · " + p.hint : "");
      item.title = p.path;
      item.addEventListener("click", () => openWikiPage(p.path, item));
      ovList.appendChild(item);
    }
  }
}

async function openWikiPage(path, itemEl) {
  const res = await fetch("/api/wiki/page?path=" + encodeURIComponent(path));
  if (!res.ok) { ovStatusMsg("페이지를 열 수 없습니다: " + path, true); return; }
  const data = await res.json();
  ovCtx = { kind: "wiki", path };
  ovTitle.textContent = "📚 " + path;
  ovText.value = data.content;
  ovStatusMsg("편집 후 저장 — 히스토리를 지우는 편집은 지양하세요 (append 원칙)");
  ovList.querySelectorAll(".item").forEach(n => n.classList.remove("active"));
  if (itemEl) itemEl.classList.add("active");
}

async function renderAgentSideList(activeName) {
  ovList.innerHTML = "";
  const sec = document.createElement("div");
  sec.className = "sec";
  sec.textContent = "에이전트 · 스킬";
  ovList.appendChild(sec);
  for (const a of agentDefs) {
    const item = document.createElement("div");
    item.className = "item" + (a.name === activeName ? " active" : "");
    item.textContent = a.name;
    item.addEventListener("click", () => openAgentEditor(a.name));
    ovList.appendChild(item);
  }
  try {
    const data = await (await fetch("/api/proposals")).json();
    if ((data.proposals || []).length) {
      const psec = document.createElement("div");
      psec.className = "sec";
      psec.textContent = "🧬 자가 진화 제안";
      ovList.appendChild(psec);
      for (const p of data.proposals) {
        const item = document.createElement("div");
        item.className = "item";
        item.textContent = "📝 " + p.name + " · " + (p.proposed_at || "");
        item.title = p.file;
        item.addEventListener("click", () => openProposal(p));
        ovList.appendChild(item);
      }
    }
  } catch (e) { /* 무시 */ }
}

async function openProposal(p) {
  const res = await fetch("/api/proposals/" + encodeURIComponent(p.file));
  if (!res.ok) { ovStatusMsg("제안을 열 수 없습니다", true); return; }
  const data = await res.json();
  overlay.hidden = false;
  ovCtx = { kind: "agent", name: data.name, fromProposal: p.file };
  ovTitle.textContent = "🧬 자가 진화 제안 검토 → " + data.name;
  ovText.value = data.content;
  ovStatusMsg("검토·수정 후 저장하면 에이전트에 적용되고 제안은 제거됩니다. 닫으면 보류됩니다.");
  renderAgentSideList(data.name);
}

async function openAgentEditor(name) {
  const res = await fetch("/api/agents/" + encodeURIComponent(name) + "/raw");
  if (!res.ok) { ovStatusMsg("에이전트를 열 수 없습니다: " + name, true); return; }
  const data = await res.json();
  overlay.hidden = false;
  ovCtx = { kind: "agent", name };
  ovTitle.textContent = "🤖 " + name + " — " + data.source;
  ovText.value = data.content;
  ovStatusMsg("본문이 플래너 시스템 프롬프트에 추가됩니다. 도구·권한은 바뀌지 않습니다.");
  renderAgentSideList(name);
}

function openNewAgent() {
  overlay.hidden = false;
  ovCtx = { kind: "agent-new" };
  ovTitle.textContent = "🤖 새 에이전트·스킬";
  ovStatus.innerHTML = "이름(소문자·숫자·하이픈): ";
  const nameInput = document.createElement("input");
  nameInput.id = "ovName";
  nameInput.placeholder = "예: network-debugger";
  ovStatus.appendChild(nameInput);
  ovText.value = "---\nname: NEW_NAME\ndescription: (한 줄 설명)\n---\n\n(조사 방식·답변 스타일에 대한 지시문을 여기에 작성)\n";
  renderAgentSideList(null);
  nameInput.focus();
}

document.getElementById("wikiBtn").addEventListener("click", openWiki);
document.getElementById("newAgentBtn").addEventListener("click", openNewAgent);

document.getElementById("ovSave").addEventListener("click", async () => {
  if (!ovCtx) { ovStatusMsg("저장할 대상이 없습니다 — 항목을 먼저 선택하세요", true); return; }
  try {
    if (ovCtx.kind === "wiki") {
      const res = await fetch("/api/wiki/page", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: ovCtx.path, content: ovText.value }),
      });
      const data = await res.json();
      if (!res.ok) { ovStatusMsg(data.error || "저장 실패", true); return; }
      ovStatusMsg(data.redacted
        ? "저장됨 — 일부 민감 값이 [REDACTED] 처리되었습니다 (다시 열어 확인하세요)"
        : "저장됨 ✓");
    } else if (ovCtx.kind === "agent") {
      const res = await fetch("/api/agents/" + encodeURIComponent(ovCtx.name) + "/raw", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: ovText.value }),
      });
      const data = await res.json();
      if (!res.ok) { ovStatusMsg(data.error || "저장 실패", true); return; }
      if (ovCtx.fromProposal) {
        await fetch("/api/proposals/" + encodeURIComponent(ovCtx.fromProposal), { method: "DELETE" });
        ovCtx.fromProposal = null;
        ovStatusMsg("제안 승인·적용됨 ✓ — 다음 질의부터 반영됩니다");
      } else {
        ovStatusMsg("저장됨 ✓ — 다음 질의부터 반영됩니다");
      }
      await loadAgents();
      renderAgentSideList(ovCtx.name);
    } else if (ovCtx.kind === "agent-new") {
      const name = (document.getElementById("ovName")?.value || "").trim().toLowerCase();
      if (!name) { ovStatusMsg("이름을 입력하세요", true); return; }
      const content = ovText.value.replace(/^name:.*$/m, "name: " + name);
      const res = await fetch("/api/agents/create", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, content }),
      });
      const data = await res.json();
      if (!res.ok) { ovStatusMsg(data.error || "생성 실패", true); return; }
      await loadAgents();
      await openAgentEditor(name);
      ovStatusMsg("생성됨 ✓ — 사이드바에서 선택해 사용하세요");
    }
  } catch (err) {
    ovStatusMsg("오류: " + err.message, true);
  }
});

// ---------- 세션 관리 ----------

async function refreshSessions() {
  const res = await fetch("/api/sessions");
  const data = await res.json();
  sessionsEl.innerHTML = "";
  for (const s of data.sessions) {
    const item = document.createElement("div");
    item.className = "sess" + (s.thread_id === threadId ? " active" : "");
    const title = document.createElement("div");
    title.className = "t";
    title.textContent = s.title || "(새 대화)";
    const meta = document.createElement("div");
    meta.className = "m";
    const tk = (s.tokens_in || 0) + (s.tokens_out || 0);
    meta.textContent = `🤖 ${s.agent} · ${s.turns}턴`
      + (tk ? ` · 🔢 ${fmtTk(tk)}tk` : "")
      + ` · ${s.updated_at.slice(5, 16).replace("T", " ")}`;
    if (s.thread_id === threadId) {
      document.getElementById("sessTokens").textContent =
        tk ? "🔢 " + fmtTk(s.tokens_in) + " in / " + fmtTk(s.tokens_out) + " out" : "";
    }
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.title = "세션 삭제 (한 번 더 누르면 확정)";
    del.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!del.classList.contains("arm")) {           // 2단계 확인 (confirm 대화상자 미사용)
        del.classList.add("arm");
        del.textContent = "확정?";
        setTimeout(() => { del.classList.remove("arm"); del.textContent = "✕"; }, 2500);
        return;
      }
      await fetch("/api/sessions/" + s.thread_id, { method: "DELETE" });
      if (s.thread_id === threadId) await newSession(false);
      refreshSessions();
    });
    item.append(title, meta, del);
    item.addEventListener("click", () => switchSession(s.thread_id));
    sessionsEl.appendChild(item);
  }
}

async function loadHistory() {
  log.innerHTML = "";
  addEvent("🛡 read-only 에이전트 — 조회(get/list/logs/top)만 가능, 생성·수정·삭제는 구조적으로 불가능합니다.");
  if (!threadId) return;
  try {
    const res = await fetch("/api/sessions/" + threadId + "/history");
    const data = await res.json();
    if (data.meta && data.meta.agent) setAgent(data.meta.agent);
    for (const turn of data.turns || []) {
      if (turn.role === "user") el("div", "msg user", turn.content);
      else renderAgent(turn.content);
    }
    if ((data.turns || []).length)
      addEvent("↺ 이전 대화 " + data.turns.length + "개 메시지를 복원했습니다 (context 유지됨)");
  } catch (e) { /* 이력 없음 — 무시 */ }
}

async function switchSession(id) {
  threadId = id;
  localStorage.setItem("inspect-k8s-thread", id);
  setThreadBadge();
  await loadHistory();
  refreshSessions();
}

async function newSession(load = true) {
  const res = await fetch("/api/sessions", { method: "POST" });
  const data = await res.json();
  threadId = data.thread_id;
  localStorage.setItem("inspect-k8s-thread", threadId);
  setThreadBadge();
  if (load) {
    log.innerHTML = "";
    addEvent("🆕 새 세션을 시작했습니다 — 대화 context는 이 세션에만 유지되고, 위키 장기 기억은 모든 세션이 공유합니다.");
  }
  refreshSessions();
}

document.getElementById("newSession").addEventListener("click", () => newSession());

// ---------- 채팅 ----------

async function send(message) {
  if (!threadId) await newSession(false);
  el("div", "msg user", message);
  const typing = el("div", "typing", "조사 중…");
  sendBtn.disabled = true;
  usageChip = null;   // 턴마다 새 사용량 칩
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message, thread_id: threadId, agent: activeAgent, reasoning: reasoningEffort,
        context: kubeContext,
      }),
    });
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const chunk = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        if (!chunk.startsWith("data: ")) continue;
        handleEvent(JSON.parse(chunk.slice(6)));
      }
    }
  } catch (err) {
    addEvent("⛔ 연결 오류: " + err.message).classList.add("error");
  } finally {
    typing.remove();
    sendBtn.disabled = false;
    input.focus();
    refreshSessions();
  }
}

function handleEvent(ev) {
  switch (ev.type) {
    case "wiki":
      addEvent("📚 위키에서 과거 관찰 " + ev.chars + "자 로드");
      break;
    case "tool_call":
      addEvent("▶ " + ev.name + " " + JSON.stringify(ev.args));
      break;
    case "tool_result":
      addToolResult(ev.name, ev.status, ev.preview);
      break;
    case "usage":
      if (!usageChip) usageChip = addEvent("");
      usageChip.textContent =
        "🔢 이번 턴 토큰: in " + fmtTk(ev.input_tokens) +
        " · out " + fmtTk(ev.output_tokens) +
        " · 합계 " + fmtTk(ev.total_tokens) +
        " (LLM 호출 " + (ev.llm_calls || 0) + "회)";
      break;
    case "final":
      renderAgent(ev.answer || "(답변 없음)");
      break;
    case "evolution":
      if (ev.lesson) addEvent("🧬 자가 진화 — 교훈 학습: " + ev.lesson);
      if (ev.proposal) addEvent("🧬 스킬 개선 제안 생성: " + ev.proposal + " (에이전트 편집기 ✎에서 검토·승인)");
      break;
    case "error":
      addEvent("⛔ " + ev.message).classList.add("error");
      break;
  }
}

document.getElementById("reflectBtn").addEventListener("click", async () => {
  if (!threadId) return;
  const waiting = addEvent("🧬 이 세션의 마지막 조사를 반성하는 중…");
  try {
    const res = await fetch("/api/sessions/" + threadId + "/reflect", { method: "POST" });
    const d = await res.json();
    waiting.remove();
    if (d.lesson) addEvent("🧬 교훈 학습: " + d.lesson);
    else addEvent("🧬 " + (d.note || d.error || "학습할 내용이 도출되지 않았습니다"));
    if (d.proposal_file) addEvent("🧬 스킬 개선 제안 생성: " + d.proposal_file + " (에이전트 편집기 ✎에서 검토·승인)");
  } catch (err) {
    waiting.remove();
    addEvent("⛔ 반성 실패: " + err.message).classList.add("error");
  }
});

form.addEventListener("submit", e => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message || sendBtn.disabled) return;
  input.value = "";
  send(message);
});
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

(async () => {
  setThreadBadge();
  await loadAgents();
  if (threadId) await loadHistory();
  else await newSession();
  await refreshSessions();
  input.focus();
})();
</script>
