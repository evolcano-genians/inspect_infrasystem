<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inspect-k8s 채팅</title>
<style>
  :root {
    --bg: #f4f6f8; --panel: #ffffff; --ink: #1c2733; --muted: #5b6b7b;
    --accent: #2563eb; --accent-ink: #ffffff; --line: #dde4ea;
    --ok: #0f766e; --warn: #b45309; --bad: #b91c1c; --chip: #eef2f6;
    --side: #eef2f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161d; --panel: #1a232e; --ink: #e6edf3; --muted: #93a4b4;
      --accent: #3b82f6; --line: #2c3947; --chip: #223041; --side: #141c26;
    }
  }
  * { box-sizing: border-box; }
  html, body { overflow: hidden; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
      "Noto Sans KR", "Segoe UI", sans-serif;
    display: flex; height: 100dvh; width: 100vw;
  }
  /* ---- 세션 사이드바 ---- */
  aside {
    width: 250px; flex-shrink: 0; background: var(--side);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
  }
  aside .brand { padding: 14px 16px 8px; font-weight: 700; font-size: 15px; flex-shrink: 0; }
  /* 세션·에이전트·지식 전체가 하나의 스크롤 영역 — 뷰포트를 넘어도 사이드바 안에서만 스크롤 */
  .side-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
  aside .newBtn {
    margin: 6px 12px 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer;
    border: 1px dashed var(--muted); background: transparent; color: var(--ink);
    font: inherit; font-size: 13px; text-align: left;
  }
  aside .newBtn:hover { border-color: var(--accent); color: var(--accent); }
  #sessions { padding: 0 8px 4px; }
  aside .newBtn { flex-shrink: 0; }
  .sess {
    position: relative; padding: 8px 26px 8px 10px; border-radius: 10px;
    cursor: pointer; margin-bottom: 2px;
  }
  .sess:hover { background: var(--chip); }
  .sess.active { background: var(--panel); border: 1px solid var(--line); }
  .sess .t { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sess .m { font-size: 11px; color: var(--muted); }
  .sess .del {
    position: absolute; right: 6px; top: 8px; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; font-size: 12px; display: none; padding: 2px 4px;
  }
  .sess:hover .del { display: block; }
  .sess .del:hover { color: var(--bad); }
  .sess .del.arm { display: block; color: var(--bad); font-weight: 700; }
  /* ---- 에이전트/도구 패널 ---- */
  .section-label {
    padding: 10px 16px 4px; font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; border-top: 1px solid var(--line);
  }
  #agents { padding: 0 8px 6px; }
  .agentItem { padding: 7px 10px; border-radius: 10px; cursor: pointer; margin-bottom: 2px; }
  .agentItem:hover { background: var(--chip); }
  .agentItem.active { background: var(--panel); border: 1px solid var(--accent); }
  .agentItem .t { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agentItem.active .t { color: var(--accent); }
  .agentItem .d { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .sess .m { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toolsBox { margin: 4px 12px 14px; font-size: 12px; color: var(--muted); }
  #toolsBox summary { cursor: pointer; padding: 4px 0; }
  #tools { max-height: 180px; overflow-y: auto; padding: 4px 0 0 4px; }
  #tools div { padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tools b { color: var(--ink); font-weight: 600; }
  /* ---- 메인 ---- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 12px 18px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    background: var(--chip); color: var(--muted);
  }
  header .badge.model { color: var(--accent); font-weight: 600; }
  select.badge { border: 1px solid var(--line); cursor: pointer; outline: none; }
  #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
  /* ---- 마크다운 렌더링 ---- */
  .agent .mdP { white-space: pre-wrap; margin: 0 0 6px; }
  .agent .mdP:last-child { margin-bottom: 0; }
  .agent .mdH { font-weight: 700; margin: 10px 0 6px; white-space: normal; }
  .agent .mdH1 { font-size: 17px; } .agent .mdH2 { font-size: 15.5px; }
  .agent .mdH3 { font-size: 14.5px; color: var(--accent); } .agent .mdH4 { font-size: 14px; }
  .agent .mdList { margin: 4px 0 8px; padding-left: 22px; white-space: normal; }
  .agent .mdList li { margin: 2px 0; }
  .agent hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  /* 표: 넓으면 자체 영역에서 가로 스크롤 (페이지 전체가 밀리지 않게) */
  .tableWrap { overflow-x: auto; margin: 8px 0 10px; border: 1px solid var(--line); border-radius: 8px; }
  table.mdTable { border-collapse: collapse; width: 100%; font-size: 13px; white-space: normal; }
  table.mdTable th, table.mdTable td {
    border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
    padding: 6px 10px; text-align: left; vertical-align: top;
  }
  table.mdTable th { background: var(--chip); font-weight: 600; position: sticky; top: 0; }
  table.mdTable tr:last-child td { border-bottom: 0; }
  table.mdTable th:last-child, table.mdTable td:last-child { border-right: 0; }
  table.mdTable tbody tr:hover { background: var(--chip); }
  table.mdTable code { font-size: 12px; }
  /* ---- 다이어그램 ---- */
  .diagram { margin: 10px 0; border: 1px solid var(--line); border-radius: 10px;
    background: var(--chip); overflow: hidden; }
  .diagramView { padding: 12px; overflow-x: auto; text-align: center; white-space: normal; }
  .diagramView svg { max-width: 100%; height: auto; }
  .diagramBar { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line);
    flex-wrap: wrap; }
  .diagramBar button {
    font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .diagramBar button:hover { border-color: var(--accent); color: var(--accent); }
  .diagramWarn { padding: 6px 12px; font-size: 12px; color: var(--bad); }
  /* ---- 다이어그램 확대 뷰어 ---- */
  .zoomOverlay {
    position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.82);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    backdrop-filter: blur(2px);
  }
  .zoomStage {
    transform-origin: center center; will-change: transform; touch-action: none;
    /* dark 테마 mermaid(밝은 선·글자)가 보이도록 어두운 배경 */
    background: #161a22; border: 1px solid #2a2f3a; border-radius: 6px; padding: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  .zoomStage svg { display: block; }
  .zoomCtrl {
    position: fixed; top: 16px; right: 16px; display: flex; gap: 6px; z-index: 101;
  }
  .zoomCtrl button {
    width: 36px; height: 36px; font-size: 16px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .zoomCtrl button:hover { border-color: var(--accent); color: var(--accent); }
  .zoomHint {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 101;
    font-size: 12px; color: #ddd; background: rgba(0,0,0,.5); padding: 5px 12px; border-radius: 999px;
  }
  /* ---- 진행 상태 표시 ---- */
  .statusBar {
    display: none; align-self: flex-start; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--muted); padding: 7px 12px; border-radius: 10px;
    background: var(--panel); border: 1px solid var(--line);
  }
  .statusBar.on { display: flex; }
  .statusBar .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .statusBar.done .dot { animation: none; background: var(--ok, #3fb950); }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
  .statusBar .elapsed { font-variant-numeric: tabular-nums; opacity: .8; }
  /* 컨텍스트 사용량 배지 */
  header .ctxUse { display: flex; align-items: center; gap: 6px; }
  header .ctxUse .bar {
    width: 54px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden;
  }
  header .ctxUse .fill { height: 100%; width: 0%; background: var(--accent); transition: width .3s; }
  header .ctxUse .fill.warn { background: #d29922; }
  header .ctxUse .fill.high { background: var(--bad); }
  /* ---- 헤더 반응형: 좁아져도 배지 글자가 줄바꿈으로 깨지지 않게 ---- */
  header { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
  header::-webkit-scrollbar { height: 4px; }
  header .badge, header select.badge, header button.badge {
    white-space: nowrap; flex-shrink: 0;   /* 단어 중간 줄바꿈(read-\nonly) 방지 */
  }
  header select.badge { max-width: 190px; text-overflow: ellipsis; }
  header .badge#thread, header .badge#sessTokens { max-width: 210px; overflow: hidden; text-overflow: ellipsis; }
  /* 좁은 창: 정보 밀도가 낮은 배지부터 숨긴다 (핵심 = read-only·대상·모델·에이전트) */
  @media (max-width: 1100px) {
    header .badge#sessTokens { display: none; }
  }
  @media (max-width: 900px) {
    header .badge#thread { display: none; }
    header .ctxUse .bar { width: 36px; }
  }
  @media (max-width: 760px) {
    header { gap: 6px; padding: 10px 12px; }
    header .badge, header select.badge, header button.badge { font-size: 10.5px; padding: 2px 6px; }
    aside { width: 200px; }
  }
  @media (max-width: 620px) {
    aside { display: none; }        /* 아주 좁으면 사이드바를 접어 본문 폭 확보 */
    .msg { max-width: 92%; }
    .event { max-width: 92%; }
  }
  .user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; position: relative; }
  /* 읽기 모드 버튼 — 답변 말풍선 우상단, 호버 시 표시 */
  .agent .readBtn {
    position: absolute; top: 6px; right: 6px; font: inherit; font-size: 11px;
    padding: 2px 8px; border-radius: 7px; cursor: pointer; opacity: 0; transition: opacity .15s;
    border: 1px solid var(--line); background: var(--chip); color: var(--muted);
  }
  .agent:hover .readBtn { opacity: 1; }
  .agent .readBtn:hover { border-color: var(--accent); color: var(--accent); }
  /* 읽기 모드 오버레이 */
  .readerOverlay {
    position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.6);
    display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
    padding: 32px 16px; backdrop-filter: blur(2px);
  }
  .readerPanel {
    width: 100%; max-width: 820px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: 0 12px 48px rgba(0,0,0,.5); overflow: hidden;
    display: flex; flex-direction: column; max-height: calc(100vh - 64px);
  }
  .readerBar {
    display: flex; align-items: center; gap: 6px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); background: var(--side); flex-shrink: 0;
  }
  .readerBar .readerTitle { font-weight: 600; font-size: 13px; }
  .readerBar button {
    font: inherit; font-size: 12px; padding: 4px 11px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .readerBar button:hover { border-color: var(--accent); color: var(--accent); }
  .readerBody {
    padding: 28px 40px 40px; overflow-y: auto; line-height: 1.75; background: var(--panel);
    letter-spacing: .01em;
  }
  .readerBody .mdH1 { font-size: 1.6em; margin-top: 4px; }
  .readerBody .mdH2 { font-size: 1.35em; }
  .readerBody .mdH3 { font-size: 1.18em; }
  .readerBody .mdP { margin-bottom: 12px; }
  .readerBody .mdList { margin: 8px 0 14px; }
  .readerBody .mdList li { margin: 5px 0; }
  .readerBody table.mdTable { font-size: .9em; }
  .readerBody pre { padding: 12px 14px; }
  @media (max-width: 620px) { .readerBody { padding: 20px 18px 30px; } }
  .agent pre, .agent code { background: var(--chip); border-radius: 6px; padding: 1px 5px; font-size: 13px; overflow-x: auto; }
  .agent pre { padding: 8px 10px; }
  .feedback { margin-top: 8px; display: flex; gap: 4px; }
  .feedback button { border: 1px solid var(--line); background: transparent; border-radius: 7px;
    cursor: pointer; font-size: 13px; padding: 2px 8px; opacity: .6; }
  .feedback button:hover { opacity: 1; }
  .feedback button.fb-on { opacity: 1; border-color: var(--accent); background: var(--chip); }
  .noteRow { display: flex; gap: 6px; margin-top: 6px; }
  .noteRow input {
    flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 4px 8px;
    border-radius: 7px; border: 1px solid var(--accent); background: var(--bg); color: var(--ink);
  }
  .noteRow button {
    font: inherit; font-size: 12px; padding: 3px 10px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .metaRow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .metaRow input {
    flex: 1; min-width: 140px; font: inherit; font-size: 13px; padding: 5px 9px;
    border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .metaRow button {
    font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .metaRow button.primary { border-color: var(--accent); color: var(--accent); }
  .metaInfo { font-size: 12px; color: var(--muted); }
  .event {
    align-self: flex-start; font-size: 12.5px; color: var(--muted);
    background: var(--chip); border-radius: 10px; padding: 5px 10px;
    display: flex; align-items: center; gap: 6px; max-width: 78%;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  }
  /* 도구 호출: 접힌 요약(▶ 이름 + 짧은 힌트), 클릭 시 인자 전체 펼침 */
  .event.toolCall { display: block; padding: 0; cursor: pointer; }
  .event.toolCall > summary {
    list-style: none; padding: 5px 10px; display: flex; gap: 8px; align-items: baseline;
    white-space: nowrap; overflow: hidden;
  }
  .event.toolCall > summary::-webkit-details-marker { display: none; }
  .event.toolCall > summary::before { content: "▸"; color: var(--muted); font-size: 10px; }
  .event.toolCall[open] > summary::before { content: "▾"; }
  .event.toolCall > summary b { color: var(--ink); font-weight: 600; flex-shrink: 0; }
  .event.toolCall .argHint { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .event.toolCall > pre {
    margin: 0; padding: 8px 10px; border-top: 1px solid var(--line); font-size: 12px;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; color: var(--ink);
  }
  .event.toolResult { flex-wrap: wrap; }
  .event .resPreview { overflow-wrap: anywhere; }
  .event .st-허용 { color: var(--ok); font-weight: 600; }
  .event .st-거부 { color: var(--bad); font-weight: 600; }
  .event .st-오류 { color: var(--warn); font-weight: 600; }
  .event.error { color: var(--bad); background: transparent; border: 1px solid var(--bad); }
  .typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding-left: 4px; }
  form {
    display: flex; flex-direction: column; gap: 8px; padding: 12px 18px 16px;
    background: var(--panel); border-top: 1px solid var(--line); position: relative;
  }
  .composerMain { display: flex; gap: 10px; align-items: flex-end; }
  #attachBtn {
    flex-shrink: 0; width: 40px; height: 40px; font-size: 18px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  #attachBtn:hover { border-color: var(--accent); }
  #attachRow { display: flex; gap: 8px; flex-wrap: wrap; }
  .attachChip { position: relative; width: 56px; height: 56px; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--line); }
  .attachChip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .attachChip button {
    position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .msgImages { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .msgImages img { max-width: 180px; max-height: 180px; border-radius: 8px; border: 1px solid var(--line); }
  .imgNote { margin-top: 6px; font-size: 11.5px; opacity: .85; }
  /* 슬래시 명령 자동완성 — 입력창 위에 떠서 표시 */
  #slashHint {
    position: absolute; bottom: calc(100% - 6px); left: 18px; right: 18px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.35); overflow: hidden; z-index: 20; max-height: 240px;
    overflow-y: auto;
  }
  .slashRow { display: flex; gap: 10px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
  .slashRow:hover { background: var(--chip); }
  .slashRow b { color: var(--accent); min-width: 84px; }
  .slashRow span { color: var(--muted); }
  textarea {
    flex: 1; resize: none; border: 1px solid var(--line); border-radius: 12px;
    background: var(--bg); color: var(--ink); padding: 10px 12px; font: inherit;
    max-height: 130px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  form button {
    border: 0; background: var(--accent); color: var(--accent-ink);
    border-radius: 12px; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer;
  }
  form button:disabled { opacity: .5; cursor: default; }
  @media (max-width: 720px) { aside { display: none; } }
  /* ---- 오버레이 편집기 (위키·에이전트 공용) ---- */
  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; z-index: 50;
  }
  #overlay[hidden] { display: none; }
  .ovPanel {
    width: min(1000px, 92vw); height: min(680px, 88vh); background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; display: flex; overflow: hidden;
  }
  .ovSide {
    width: 240px; flex-shrink: 0; border-right: 1px solid var(--line);
    background: var(--side); overflow-y: auto; padding: 10px 8px;
  }
  .ovSide .sec { font-size: 11px; color: var(--muted); padding: 8px 8px 3px; text-transform: uppercase; }
  .ovSide .item { padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ovSide .item:hover { background: var(--chip); }
  .ovSide .item.active { background: var(--panel); border: 1px solid var(--line); }
  .ovMain { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .ovHead { display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; }
  .ovHead .spacer { flex: 1; }
  .ovHead button {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 8px; padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .ovHead button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #ovStatus { padding: 4px 14px; font-size: 12px; color: var(--muted); min-height: 22px; }
  #ovStatus input {
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
    color: var(--ink); padding: 3px 8px; font: inherit; font-size: 12px;
  }
  #ovText {
    flex: 1; border: 0; outline: none; resize: none; padding: 12px 14px;
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

<script>
"use strict";
const log = document.getElementById("log");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const sessionsEl = document.getElementById("sessions");

let threadId = localStorage.getItem("inspect-k8s-thread") || null;
let activeAgent = "inspector";
let agentDefs = [];
let usageChip = null;   // 현재 턴의 토큰 사용량 표시 요소 (usage 이벤트마다 갱신)
let currentStatus = null;  // 진행 중인 턴의 상태 표시 핸들
// 컨텍스트 윈도우: 이번 턴 input_tokens = 모델에 실제로 들어간 대화+위키+도구결과 총량.
// gpt-5 계열 400k 기준(모델이 바뀌면 /api/health의 model로 조정).
let ctxWindow = 400000;
let ctxUsed = 0;

function fmtTk(n) {
  n = n || 0;
  return n >= 10000 ? (n / 1000).toFixed(1) + "k" : n.toLocaleString();
}

function updateContextUse(ev) {
  // input_tokens가 곧 "이번 요청이 차지한 컨텍스트 크기"다. 턴이 진행될수록 커진다.
  const used = ev.input_tokens || 0;
  if (used > ctxUsed) ctxUsed = used;
  const box = document.getElementById("ctxUse");
  const fill = document.getElementById("ctxFill");
  const text = document.getElementById("ctxText");
  if (!box || !fill || !text) return;
  box.hidden = false;
  const pct = Math.min(100, (ctxUsed / ctxWindow) * 100);
  fill.style.width = pct.toFixed(1) + "%";
  fill.className = "fill" + (pct >= 80 ? " high" : pct >= 60 ? " warn" : "");
  text.textContent = fmtTk(ctxUsed) + " / " + fmtTk(ctxWindow) + " (" + pct.toFixed(0) + "%)";
  box.title = `이 대화가 사용 중인 컨텍스트 윈도우: ${ctxUsed.toLocaleString()} / ${ctxWindow.toLocaleString()} 토큰`
    + (pct >= 80 ? " — 한계에 근접했습니다. 새 세션을 시작하면 초기화됩니다." : "");
}

function resetContextUse() {
  ctxUsed = 0;
  const box = document.getElementById("ctxUse");
  if (box) box.hidden = true;
}

function setThreadBadge() {
  document.getElementById("thread").textContent = "세션 " + (threadId || "…");
}
function setAgent(name) {
  activeAgent = name;
  document.getElementById("agentBadge").textContent = "🤖 " + name;
  renderAgents();
}

let reasoningEffort = localStorage.getItem("inspect-k8s-effort") || "";
let kubeContext = localStorage.getItem("inspect-k8s-context") || "";

fetch("/api/health").then(r => r.json()).then(h => {
  document.getElementById("model").textContent = h.model;
  const tgt = document.getElementById("target");
  const opts = h.context_options || [];
  if (tgt) {
    tgt.textContent = (h.real_cluster ? "🌐 실" : "🧪 샌드박스") + (opts.length ? "" : " " + (h.context || ""));
    tgt.style.color = h.real_cluster ? "var(--warn)" : "var(--muted)";
  }
  const csel = document.getElementById("ctxSel");
  if (opts.length && csel) {
    csel.hidden = false;
    if (!opts.includes(kubeContext)) kubeContext = h.context;
    for (const name of opts) {
      const o = document.createElement("option");
      o.value = name;
      o.textContent = name;
      if (name === kubeContext) o.selected = true;
      csel.appendChild(o);
    }
    csel.addEventListener("change", () => {
      kubeContext = csel.value;
      localStorage.setItem("inspect-k8s-context", kubeContext);
      addEvent("🌐 조사 대상 클러스터 전환: " + kubeContext + " (다음 질의부터 적용)");
    });
  }
  const sel = document.getElementById("effortSel");
  if ((h.reasoning_options || []).length) {
    sel.hidden = false;
    if (!h.reasoning_options.includes(reasoningEffort)) reasoningEffort = h.reasoning_effort;
    for (const opt of h.reasoning_options) {
      const o = document.createElement("option");
      o.value = opt;
      o.textContent = "추론 " + opt + (opt === h.reasoning_effort ? " (기본)" : "");
      if (opt === reasoningEffort) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener("change", () => {
      reasoningEffort = sel.value;
      localStorage.setItem("inspect-k8s-effort", reasoningEffort);
      addEvent("🧠 추론 모드 변경: " + reasoningEffort + " (다음 질의부터 적용)");
    });
  }
}).catch(() => {});

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  log.appendChild(node);
  log.scrollTop = log.scrollHeight;
  return node;
}
function addEvent(text) { return el("div", "event", text); }

// 짧은 인자 힌트 — 긴 값은 잘라 요약(펼치면 전체가 보인다)
function argHint(args) {
  if (!args || typeof args !== "object") return "";
  const parts = [];
  for (const [k, v] of Object.entries(args)) {
    if (v === "" || v === null || v === undefined) continue;
    let s = typeof v === "string" ? v : JSON.stringify(v);
    if (s.length > 24) s = s.slice(0, 24) + "…";
    parts.push(`${k}=${s}`);
    if (parts.length >= 2) break;
  }
  return parts.join(" ");
}

// 도구 호출을 접힌 형태로 — 일일이 나열하지 않고 클릭하면 인자 전체를 펼쳐 본다.
function addToolCall(name, args) {
  const det = document.createElement("details");
  det.className = "event toolCall";
  const sum = document.createElement("summary");
  const nm = document.createElement("b"); nm.textContent = "▶ " + name;
  const hint = document.createElement("span"); hint.className = "argHint"; hint.textContent = argHint(args);
  sum.append(nm, hint);
  const pre = document.createElement("pre");
  pre.textContent = JSON.stringify(args || {}, null, 2);
  det.append(sum, pre);
  log.appendChild(det);
  log.scrollTop = log.scrollHeight;
  return det;
}

// 복원된 이전 조사의 도구 호출 묶음 — 한 줄 요약, 클릭하면 전체 목록
function addToolBatch(calls) {
  if (!calls.length) return;
  const det = document.createElement("details");
  det.className = "event toolCall";
  const sum = document.createElement("summary");
  const nm = document.createElement("b");
  nm.textContent = "🛠 도구 " + calls.length + "회";
  const hint = document.createElement("span");
  hint.className = "argHint";
  const names = [...new Set(calls.map(c => c.name))];
  hint.textContent = names.slice(0, 3).join(", ") + (names.length > 3 ? ` 외 ${names.length - 3}종` : "");
  sum.append(nm, hint);
  const pre = document.createElement("pre");
  pre.textContent = calls.map(c => `▶ ${c.name} ${JSON.stringify(c.args || {})}`).join("\n");
  det.append(sum, pre);
  log.appendChild(det);
  log.scrollTop = log.scrollHeight;
}

function addToolResult(name, status, preview) {
  const node = el("div", "event toolResult");
  const badge = document.createElement("span");
  badge.className = "st-" + status;
  badge.textContent = status;
  node.append("🛠 " + name + " → ");
  node.appendChild(badge);
  if (status !== "허용" && preview) {
    const p = document.createElement("span");
    p.className = "resPreview";
    p.textContent = " · " + preview.slice(0, 160);
    node.appendChild(p);
  }
  log.scrollTop = log.scrollHeight;
}

// ---------- 마크다운 렌더링 (표·제목·목록·강조) ----------
// XSS 방지: 모든 텍스트는 textContent로만 넣는다(innerHTML 미사용).
function renderInline(text, parent) {
  // `코드`, **굵게**, *기울임* 순으로 안전하게 분해
  text.split(/(`[^`]+`)/).forEach(seg => {
    if (seg.startsWith("`") && seg.endsWith("`") && seg.length > 2) {
      const code = document.createElement("code");
      code.textContent = seg.slice(1, -1);
      parent.appendChild(code);
      return;
    }
    seg.split(/(\*\*[^*]+\*\*)/).forEach(s2 => {
      if (s2.startsWith("**") && s2.endsWith("**") && s2.length > 4) {
        const b = document.createElement("strong");
        b.textContent = s2.slice(2, -2);
        parent.appendChild(b);
      } else if (s2) {
        parent.appendChild(document.createTextNode(s2));
      }
    });
  });
}

function splitRow(line) {
  let s = line.trim();
  if (s.startsWith("|")) s = s.slice(1);
  if (s.endsWith("|")) s = s.slice(0, -1);
  return s.split("|").map(c => c.trim());
}

const _isTableSep = ln => /^\s*\|?[\s:-]*-[-\s:|]*\|?\s*$/.test(ln) && ln.includes("-");
const _isTableRow = ln => ln.trim().startsWith("|") && ln.trim().endsWith("|") && ln.includes("|");

function renderMarkdownBlocks(text, parent) {
  const lines = text.split("\n");
  let i = 0;
  let para = [];

  const flushPara = () => {
    if (!para.length) return;
    const p = document.createElement("div");
    p.className = "mdP";
    renderInline(para.join("\n"), p);
    parent.appendChild(p);
    para = [];
  };

  while (i < lines.length) {
    const line = lines[i];

    // 표: 헤더행 + 구분행 + 본문행들
    if (_isTableRow(line) && i + 1 < lines.length && _isTableSep(lines[i + 1])) {
      flushPara();
      const header = splitRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && _isTableRow(lines[i])) { rows.push(splitRow(lines[i])); i++; }
      const wrap = document.createElement("div");
      wrap.className = "tableWrap";
      const table = document.createElement("table");
      table.className = "mdTable";
      const thead = document.createElement("thead");
      const htr = document.createElement("tr");
      header.forEach(h => { const th = document.createElement("th"); renderInline(h, th); htr.appendChild(th); });
      thead.appendChild(htr); table.appendChild(thead);
      const tbody = document.createElement("tbody");
      rows.forEach(r => {
        const tr = document.createElement("tr");
        for (let c = 0; c < header.length; c++) {
          const td = document.createElement("td");
          renderInline(r[c] !== undefined ? r[c] : "", td);
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });
      table.appendChild(tbody); wrap.appendChild(table); parent.appendChild(wrap);
      continue;
    }

    // 제목 (#, ##, ###)
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      flushPara();
      const tag = document.createElement("div");
      tag.className = "mdH mdH" + h[1].length;
      renderInline(h[2], tag);
      parent.appendChild(tag);
      i++; continue;
    }

    // 목록 (-, *, 1.) — 연속 항목을 한 블록으로
    if (/^\s*([-*+]|\d+\.)\s+/.test(line)) {
      flushPara();
      const ordered = /^\s*\d+\./.test(line);
      const list = document.createElement(ordered ? "ol" : "ul");
      list.className = "mdList";
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
        const li = document.createElement("li");
        renderInline(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, ""), li);
        list.appendChild(li);
        i++;
      }
      parent.appendChild(list);
      continue;
    }

    // 구분선
    if (/^\s*(---+|___+|\*\*\*+)\s*$/.test(line)) {
      flushPara();
      parent.appendChild(document.createElement("hr"));
      i++; continue;
    }

    if (line.trim() === "") { flushPara(); i++; continue; }
    para.push(line);
    i++;
  }
  flushPara();
}

// ---------- 다이어그램(mermaid) 도식화 + 이미지 저장 ----------
let mermaidReady = null;
let diagramSeq = 0;

function loadMermaid() {
  // 로컬 번들(/vendor/mermaid.min.js) — 오프라인·CSP 환경에서도 동작
  if (mermaidReady) return mermaidReady;
  mermaidReady = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "/vendor/mermaid.min.js";
    s.onload = () => {
      try {
        window.mermaid.initialize({
          startOnLoad: false,
          theme: "dark",
          securityLevel: "strict",   // 다이어그램 텍스트는 신뢰 불가 데이터 — 스크립트 실행 차단
          fontFamily: "inherit",
        });
        resolve(window.mermaid);
      } catch (e) { reject(e); }
    };
    s.onerror = () => reject(new Error("mermaid 로드 실패"));
    document.head.appendChild(s);
  });
  return mermaidReady;
}

function downloadBlob(blob, filename) {
  // Electron/브라우저 공통: a[download] + object URL
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function svgToPng(svgEl, filename, scale) {
  // SVG를 canvas에 그려 PNG로 저장 (외부 리소스 없이 직렬화 → data URL)
  const clone = svgEl.cloneNode(true);
  const bbox = svgEl.getBoundingClientRect();
  const w = Math.max(1, Math.ceil(bbox.width || 800));
  const h = Math.max(1, Math.ceil(bbox.height || 600));
  clone.setAttribute("width", w); clone.setAttribute("height", h);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  const svgText = new XMLSerializer().serializeToString(clone);
  const img = new Image();
  img.onload = () => {
    const k = scale || 2;
    const canvas = document.createElement("canvas");
    canvas.width = w * k; canvas.height = h * k;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = getComputedStyle(document.body).backgroundColor || "#0f1115";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.drawImage(img, 0, 0);
    canvas.toBlob(b => b && downloadBlob(b, filename), "image/png");
  };
  img.onerror = () => addEvent("⚠️ PNG 변환 실패 — SVG로 저장해 주세요");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgText);
}

// 다이어그램 전체화면 확대 뷰어 — 휠 줌 + 드래그 팬 + 버튼(+/-/리셋)
function openDiagramZoom(svg, safeName) {
  const back = document.createElement("div");
  back.className = "zoomOverlay";
  const stage = document.createElement("div");
  stage.className = "zoomStage";
  stage.innerHTML = svg;
  const svgEl = stage.querySelector("svg");
  // mermaid SVG는 명시적 px 크기가 없어 그대로 두면 컨테이너에서 0으로 수축한다.
  // viewBox(또는 width/height 속성)에서 원래 크기를 읽어 픽셀로 고정한다.
  let baseW = 800, baseH = 600;
  if (svgEl) {
    const vb = (svgEl.getAttribute("viewBox") || "").split(/[\s,]+/).map(Number);
    if (vb.length === 4 && vb[2] > 0 && vb[3] > 0) { baseW = vb[2]; baseH = vb[3]; }
    else {
      baseW = parseFloat(svgEl.getAttribute("width")) || baseW;
      baseH = parseFloat(svgEl.getAttribute("height")) || baseH;
    }
    svgEl.removeAttribute("width"); svgEl.removeAttribute("height");
    svgEl.style.maxWidth = "none";
    svgEl.style.width = baseW + "px";
    svgEl.style.height = baseH + "px";
    svgEl.style.display = "block";
  }
  // 초기 배율: 다이어그램이 화면(90%×82%)에 딱 맞게. 이후 휠/버튼으로 더 확대 가능.
  const fitScale = Math.min((window.innerWidth * 0.9) / baseW,
                            (window.innerHeight * 0.82) / baseH) || 1;

  let scale = fitScale, tx = 0, ty = 0, dragging = false, sx = 0, sy = 0;
  const apply = () => { stage.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
  const zoomAt = (factor) => { scale = Math.min(12, Math.max(0.1, scale * factor)); apply(); };

  back.addEventListener("wheel", e => {
    e.preventDefault();
    zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });
  stage.addEventListener("pointerdown", e => {
    dragging = true; sx = e.clientX - tx; sy = e.clientY - ty;
    stage.setPointerCapture(e.pointerId); stage.style.cursor = "grabbing";
  });
  stage.addEventListener("pointermove", e => {
    if (!dragging) return; tx = e.clientX - sx; ty = e.clientY - sy; apply();
  });
  const endDrag = () => { dragging = false; stage.style.cursor = "grab"; };
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);

  // 컨트롤 바
  const ctrl = document.createElement("div");
  ctrl.className = "zoomCtrl";
  const btn = (label, title, fn) => {
    const b = document.createElement("button"); b.textContent = label; b.title = title;
    b.addEventListener("click", e => { e.stopPropagation(); fn(); }); ctrl.appendChild(b); return b;
  };
  const reset = () => { scale = fitScale; tx = 0; ty = 0; apply(); };
  btn("＋", "확대", () => zoomAt(1.25));
  btn("－", "축소", () => zoomAt(1 / 1.25));
  btn("⤢", "화면에 맞춤(리셋)", reset);
  btn("🖼", "PNG 저장", () => { if (svgEl) svgToPng(svgEl, safeName + ".png", 2); });
  btn("✕", "닫기 (Esc)", () => close());

  const close = () => { document.removeEventListener("keydown", onKey); back.remove(); };
  const onKey = e => {
    if (e.key === "Escape") close();
    else if (e.key === "+" || e.key === "=") zoomAt(1.25);
    else if (e.key === "-") zoomAt(1 / 1.25);
    else if (e.key === "0") reset();
  };
  document.addEventListener("keydown", onKey);
  back.addEventListener("click", e => { if (e.target === back) close(); });  // 배경 클릭 닫기

  const hint = document.createElement("div");
  hint.className = "zoomHint";
  hint.textContent = "휠: 줌 · 드래그: 이동 · Esc: 닫기";

  stage.style.cursor = "grab";
  back.append(stage, ctrl, hint);
  document.body.appendChild(back);
  apply();
}

function makeDiagram(code) {
  const wrap = document.createElement("div");
  wrap.className = "diagram";
  const view = document.createElement("div");
  view.className = "diagramView";
  view.textContent = "다이어그램 렌더링 중…";
  const bar = document.createElement("div");
  bar.className = "diagramBar";
  wrap.append(view, bar);

  const id = "mmd-" + (++diagramSeq) + "-" + Date.now().toString(36);
  const safeName = "diagram-" + new Date().toISOString().slice(0, 19).replace(/[:T]/g, "");

  loadMermaid()
    .then(m => m.render(id, code))
    .then(({ svg }) => {
      view.innerHTML = svg;
      const svgEl = view.querySelector("svg");
      if (svgEl) {
        svgEl.style.maxWidth = "100%"; svgEl.style.height = "auto";
        // 다이어그램을 클릭하면 전체화면으로 확대(줌·팬)
        view.style.cursor = "zoom-in";
        view.title = "클릭하면 확대해서 봅니다";
        view.addEventListener("click", () => openDiagramZoom(svg, safeName));
      }
      const mk = (label, title, fn) => {
        const b = document.createElement("button");
        b.textContent = label; b.title = title;
        b.addEventListener("click", fn);
        bar.appendChild(b);
      };
      mk("🔍 확대", "전체화면으로 확대(휠 줌·드래그 이동)", () => openDiagramZoom(svg, safeName));
      mk("🖼 PNG 저장", "다이어그램을 PNG 이미지로 내려받기", () => {
        if (svgEl) svgToPng(svgEl, safeName + ".png", 2);
      });
      mk("💾 SVG 저장", "벡터 SVG로 내려받기", () => {
        if (!svgEl) return;
        const s = new XMLSerializer().serializeToString(svgEl);
        downloadBlob(new Blob([s], { type: "image/svg+xml;charset=utf-8" }), safeName + ".svg");
      });
      mk("📋 소스 복사", "mermaid 소스를 클립보드로", async () => {
        try { await navigator.clipboard.writeText(code); addEvent("📋 mermaid 소스 복사됨"); }
        catch { addEvent("⚠️ 클립보드 접근 불가"); }
      });
    })
    .catch(err => {
      // 렌더 실패 시 원본 소스를 그대로 보여준다(정보 손실 방지)
      view.textContent = "";
      const pre = document.createElement("pre");
      pre.textContent = code;
      view.appendChild(pre);
      const warn = document.createElement("div");
      warn.className = "diagramWarn";
      warn.textContent = "⚠️ 다이어그램 렌더 실패 (" + (err && err.message ? err.message : "구문 오류") + ") — 원본 표시";
      wrap.insertBefore(warn, bar);
    });
  return wrap;
}

// 답변 본문(마크다운 + 코드 + mermaid 다이어그램)을 container에 렌더한다.
// renderAgent(채팅 말풍선)와 읽기 모드(전체화면 확대)가 공유한다.
function renderAnswerBody(container, text) {
  const parts = text.split(/```/);
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const langMatch = part.match(/^([a-z]*)\n/);
      const lang = langMatch ? langMatch[1] : "";
      const body = part.replace(/^[a-z]*\n/, "");
      if (lang === "mermaid") {
        container.appendChild(makeDiagram(body));
        return;
      }
      const pre = document.createElement("pre");
      pre.textContent = body;
      container.appendChild(pre);
    } else {
      renderMarkdownBlocks(part, container);
    }
  });
}

// 읽기 모드 — 답변을 전체화면에서 크고 편안한 서식으로. 글자 크기 조절·복사·닫기.
let readerFontStep = 0;
function openReader(text) {
  const back = document.createElement("div");
  back.className = "readerOverlay";
  const panel = document.createElement("div");
  panel.className = "readerPanel";
  const bar = document.createElement("div");
  bar.className = "readerBar";
  const article = document.createElement("div");
  article.className = "readerBody agent";

  const applyFont = () => { article.style.fontSize = (17 + readerFontStep * 1.5) + "px"; };
  const mkBtn = (label, title, fn) => {
    const b = document.createElement("button"); b.textContent = label; b.title = title;
    b.addEventListener("click", fn); bar.appendChild(b); return b;
  };
  const spacer = document.createElement("span"); spacer.style.flex = "1";
  bar.appendChild(Object.assign(document.createElement("span"),
    { className: "readerTitle", textContent: "📖 읽기 모드" }));
  bar.appendChild(spacer);
  mkBtn("A－", "글자 작게", () => { readerFontStep = Math.max(-3, readerFontStep - 1); applyFont(); });
  mkBtn("A＋", "글자 크게", () => { readerFontStep = Math.min(8, readerFontStep + 1); applyFont(); });
  mkBtn("📋 복사", "답변 전체 복사", async () => {
    try { await navigator.clipboard.writeText(text); addEvent("📋 답변 복사됨"); }
    catch { addEvent("⚠️ 클립보드 접근 불가"); }
  });
  mkBtn("✕ 닫기", "닫기 (Esc)", () => close());

  renderAnswerBody(article, text);
  applyFont();
  panel.append(bar, article);
  back.appendChild(panel);

  const close = () => { document.removeEventListener("keydown", onKey); back.remove(); };
  const onKey = e => {
    if (e.key === "Escape") close();
    else if ((e.key === "+" || e.key === "=") && (e.ctrlKey || e.metaKey)) { e.preventDefault(); readerFontStep = Math.min(8, readerFontStep + 1); applyFont(); }
    else if (e.key === "-" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); readerFontStep = Math.max(-3, readerFontStep - 1); applyFont(); }
  };
  document.addEventListener("keydown", onKey);
  back.addEventListener("click", e => { if (e.target === back) close(); });
  document.body.appendChild(back);
}

function renderAgent(text, turnId) {
  const node = el("div", "msg agent");
  node._raw = text;   // 읽기 모드가 원문을 다시 렌더할 수 있도록 보관
  renderAnswerBody(node, text);
  // 읽기 모드 버튼(호버 시 우상단) — 답변이 어느 정도 길 때만 노출
  if (text.length > 140) {
    const readBtn = document.createElement("button");
    readBtn.className = "readBtn"; readBtn.textContent = "📖 읽기 모드";
    readBtn.title = "답변을 크게·보기 좋게 확대해서 읽기";
    readBtn.addEventListener("click", () => openReader(text));
    node.appendChild(readBtn);
  }
  if (turnId) {
    const fb = document.createElement("div");
    fb.className = "feedback";
    for (const [label, rating, title] of [["👍", "good", "정확·유용"], ["👎", "bad", "부정확·개선 필요"], ["📝", "note", "메모 남기기"]]) {
      const b = document.createElement("button");
      b.textContent = label; b.title = title;
      const submit = async (note) => {
        await fetch("/api/feedback", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ turn_id: turnId, rating, note: note || "" }),
        });
        fb.querySelectorAll("button").forEach(x => x.classList.remove("fb-on"));
        b.classList.add("fb-on");
        addEvent("🧩 피드백 기록됨 (하네스 개선에 활용) — " + title);
      };
      b.addEventListener("click", async () => {
        // Electron 렌더러는 window.prompt()를 지원하지 않는다 → 인라인 입력으로 처리
        if (rating === "note") {
          if (fb.querySelector(".noteRow")) return;
          const row = document.createElement("div");
          row.className = "noteRow";
          const inp = document.createElement("input");
          inp.type = "text";
          inp.placeholder = "개선 메모 (이 답변에 대해) — Enter 저장, Esc 취소";
          const ok = document.createElement("button");
          ok.textContent = "저장";
          const cancel = () => row.remove();
          const save = async () => {
            const v = inp.value.trim();
            if (!v) { cancel(); return; }
            row.remove();
            await submit(v);
          };
          ok.addEventListener("click", save);
          inp.addEventListener("keydown", e => {
            if (e.key === "Enter") { e.preventDefault(); save(); }
            if (e.key === "Escape") { e.preventDefault(); cancel(); }
          });
          row.append(inp, ok);
          fb.parentElement.appendChild(row);
          inp.focus();
          return;
        }
        await submit("");
      });
      fb.appendChild(b);
    }
    node.appendChild(fb);
  }
  log.scrollTop = log.scrollHeight;
}

      if (!res.ok) { ovStatusMsg(data.error || "저장 실패", true); return; }
      ovStatusMsg(data.redacted
        ? "저장됨 — 일부 민감 값이 [REDACTED] 처리되었습니다 (다시 열어 확인하세요)"
        : "저장됨 ✓");
    } else if (ovCtx.kind === "agent") {
      const res = await fetch("/api/agents/" + encodeURIComponent(ovCtx.name) + "/raw", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: ovText.value }),
      });
      const data = await res.json();
      if (!res.ok) { ovStatusMsg(data.error || "저장 실패", true); return; }
      if (ovCtx.fromProposal) {
        await fetch("/api/proposals/" + encodeURIComponent(ovCtx.fromProposal), { method: "DELETE" });
        ovCtx.fromProposal = null;
        ovStatusMsg("제안 승인·적용됨 ✓ — 다음 질의부터 반영됩니다");
      } else {
        ovStatusMsg("저장됨 ✓ — 다음 질의부터 반영됩니다");
      }
      await loadAgents();
      renderAgentSideList(ovCtx.name);
    } else if (ovCtx.kind === "agent-new") {
      const name = (document.getElementById("ovName")?.value || "").trim().toLowerCase();
      if (!name) { ovStatusMsg("이름을 입력하세요", true); return; }
      const content = ovText.value.replace(/^name:.*$/m, "name: " + name);
      const res = await fetch("/api/agents/create", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, content }),
      });
      const data = await res.json();
      if (!res.ok) { ovStatusMsg(data.error || "생성 실패", true); return; }
      await loadAgents();
      await openAgentEditor(name);
      ovStatusMsg("생성됨 ✓ — 사이드바에서 선택해 사용하세요");
    }
  } catch (err) {
    ovStatusMsg("오류: " + err.message, true);
  }
});

// ---------- 세션 관리 ----------

async function refreshSessions() {
  const res = await fetch("/api/sessions");
  const data = await res.json();
  sessionsEl.innerHTML = "";
  for (const s of data.sessions) {
    const item = document.createElement("div");
    item.className = "sess" + (s.thread_id === threadId ? " active" : "");
    const title = document.createElement("div");
    title.className = "t";
    title.textContent = s.title || "(새 대화)";
    const meta = document.createElement("div");
    meta.className = "m";
    const tk = (s.tokens_in || 0) + (s.tokens_out || 0);
    meta.textContent = `🤖 ${s.agent} · ${s.turns}턴`
      + (tk ? ` · 🔢 ${fmtTk(tk)}tk` : "")
      + ` · ${s.updated_at.slice(5, 16).replace("T", " ")}`;
    if (s.thread_id === threadId) {
      document.getElementById("sessTokens").textContent =
        tk ? "🔢 " + fmtTk(s.tokens_in) + " in / " + fmtTk(s.tokens_out) + " out" : "";
    }
    const del = document.createElement("button");
    del.className = "del";
    del.textContent = "✕";
    del.title = "세션 삭제 (한 번 더 누르면 확정)";
    del.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!del.classList.contains("arm")) {           // 2단계 확인 (confirm 대화상자 미사용)
        del.classList.add("arm");
        del.textContent = "확정?";
        setTimeout(() => { del.classList.remove("arm"); del.textContent = "✕"; }, 2500);
        return;
      }
      await fetch("/api/sessions/" + s.thread_id, { method: "DELETE" });
      if (s.thread_id === threadId) await newSession(false);
      refreshSessions();
    });
    item.append(title, meta, del);
    item.addEventListener("click", () => switchSession(s.thread_id));
    sessionsEl.appendChild(item);
  }
}

async function loadHistory() {
  log.innerHTML = "";
  addEvent("🛡 read-only 에이전트 — 조회(get/list/logs/top)만 가능, 생성·수정·삭제는 구조적으로 불가능합니다.");
  if (!threadId) return;
  try {
    const res = await fetch("/api/sessions/" + threadId + "/history");
    const data = await res.json();
    if (data.meta && data.meta.agent) setAgent(data.meta.agent);
    let msgCount = 0;
    for (const turn of data.turns || []) {
      if (turn.role === "user") {
        const u = el("div", "msg user", turn.content);
        if (turn.images) {   // 이미지 원본은 체크포인트에 없으므로 표식만 복원
          const note = document.createElement("div");
          note.className = "imgNote"; note.textContent = `🖼 이미지 ${turn.images}장 첨부됨`;
          u.appendChild(note);
        }
        msgCount++;
      }
      else if (turn.role === "tools") {
        // 이전 조사의 도구 호출들 — 접힌 묶음 하나로(클릭 시 펼침)
        addToolBatch(turn.calls || []);
      } else { renderAgent(turn.content); msgCount++; }
    }
    if (msgCount)
      addEvent("↺ 이전 대화 " + msgCount + "개 메시지를 복원했습니다 (도구 활동 포함 · context 유지됨)");
  } catch (e) { /* 이력 없음 — 무시 */ }
}

async function switchSession(id) {
  threadId = id;
  localStorage.setItem("inspect-k8s-thread", id);
  setThreadBadge();
  resetContextUse();   // 세션마다 컨텍스트 윈도우는 독립
  await loadHistory();
  refreshSessions();
}

async function newSession(load = true) {
  const res = await fetch("/api/sessions", { method: "POST" });
  const data = await res.json();
  threadId = data.thread_id;
  localStorage.setItem("inspect-k8s-thread", threadId);
  setThreadBadge();
  resetContextUse();
  if (load) {
    log.innerHTML = "";
    addEvent("🆕 새 세션을 시작했습니다 — 대화 context는 이 세션에만 유지되고, 위키 장기 기억은 모든 세션이 공유합니다.");
  }
  refreshSessions();
}

document.getElementById("newSession").addEventListener("click", () => newSession());

// ---------- 채팅 ----------

// ---------- 진행 상태 표시 ----------
// 사용자가 "지금 생각 중인지 / 도구를 쓰는 중인지 / 끝났는지"를 항상 볼 수 있게 한다.
function makeStatus() {
  const bar = el("div", "statusBar on");
  const dot = document.createElement("span"); dot.className = "dot";
  const label = document.createElement("span"); label.className = "label";
  label.textContent = "생각하는 중…";
  const elapsed = document.createElement("span"); elapsed.className = "elapsed";
  bar.append(dot, label, elapsed);
  const t0 = Date.now();
  let toolCount = 0;
  const timer = setInterval(() => {
    elapsed.textContent = ((Date.now() - t0) / 1000).toFixed(1) + "초";
  }, 100);
  return {
    node: bar,
    set(text) { label.textContent = text; log.scrollTop = log.scrollHeight; },
    tool(name) { toolCount++; label.textContent = `🛠 조사 중 — ${name} (도구 ${toolCount}회)`; },
    finish(text) {
      clearInterval(timer);
      bar.classList.add("done");
      const secs = ((Date.now() - t0) / 1000).toFixed(1);
      label.textContent = text || "완료";
      elapsed.textContent = secs + "초 · 도구 " + toolCount + "회";
    },
    stop() { clearInterval(timer); },
  };
}

// ---------- 이미지 첨부 (멀티모달 입력) ----------
let pendingImages = [];  // {name, dataUrl} 목록 — 다음 전송에 포함
const MAX_IMAGES = 4;
const MAX_IMG_BYTES = 7 * 1024 * 1024;
const attachRow = document.getElementById("attachRow");
const fileInput = document.getElementById("fileInput");

function renderAttachments() {
  attachRow.innerHTML = "";
  attachRow.hidden = pendingImages.length === 0;
  pendingImages.forEach((im, i) => {
    const chip = document.createElement("div");
    chip.className = "attachChip";
    const img = document.createElement("img");
    img.src = im.dataUrl; img.alt = im.name;
    const x = document.createElement("button");
    x.type = "button"; x.textContent = "✕"; x.title = "제거";
    x.addEventListener("click", () => { pendingImages.splice(i, 1); renderAttachments(); });
    chip.append(img, x);
    attachRow.appendChild(chip);
  });
}

function addImageFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  if (pendingImages.length >= MAX_IMAGES) { addEvent("⚠️ 이미지는 최대 " + MAX_IMAGES + "장까지"); return; }
  if (file.size > MAX_IMG_BYTES) { addEvent("⚠️ 이미지가 너무 큽니다(최대 7MB): " + file.name); return; }
  const reader = new FileReader();
  reader.onload = () => { pendingImages.push({ name: file.name || "image", dataUrl: reader.result }); renderAttachments(); };
  reader.readAsDataURL(file);
}

document.getElementById("attachBtn").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", e => { [...e.target.files].forEach(addImageFile); fileInput.value = ""; });
// 붙여넣기(클립보드 이미지)
input.addEventListener("paste", e => {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items) if (it.type.startsWith("image/")) { addImageFile(it.getAsFile()); e.preventDefault(); }
});
// 드래그&드롭 (로그 영역 또는 입력창)
["dragover", "drop"].forEach(ev => {
  document.getElementById("composer").addEventListener(ev, e => {
    if (![...(e.dataTransfer?.types || [])].includes("Files")) return;
    e.preventDefault();
    if (ev === "drop") [...e.dataTransfer.files].forEach(addImageFile);
  });
});

async function send(message) {
  if (!threadId) await newSession(false);
  const images = pendingImages.slice();      // 이번 전송에 포함할 이미지
  pendingImages = []; renderAttachments();
  const userMsg = el("div", "msg user", message);
  if (images.length) {                        // 사용자 말풍선에 썸네일 표시
    const thumbs = document.createElement("div");
    thumbs.className = "msgImages";
    images.forEach(im => { const t = document.createElement("img"); t.src = im.dataUrl; t.alt = im.name; thumbs.appendChild(t); });
    userMsg.appendChild(thumbs);
  }
  const status = makeStatus();
  currentStatus = status;
  sendBtn.disabled = true;
  usageChip = null;   // 턴마다 새 사용량 칩
  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message, thread_id: threadId, agent: activeAgent, reasoning: reasoningEffort,
        context: kubeContext, images: images.map(im => im.dataUrl),
      }),
    });
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buffer.indexOf("\n\n")) >= 0) {
        const chunk = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        if (!chunk.startsWith("data: ")) continue;
        handleEvent(JSON.parse(chunk.slice(6)));
      }
    }
  } catch (err) {
    addEvent("⛔ 연결 오류: " + err.message).classList.add("error");
    status.finish("⛔ 중단됨");
  } finally {
    status.stop();
    if (!status.node.classList.contains("done")) status.finish("✅ 완료");
    currentStatus = null;
    sendBtn.disabled = false;
    input.focus();
    refreshSessions();
  }
}

function handleEvent(ev) {
  switch (ev.type) {
    case "start":
      if (currentStatus) currentStatus.set("🧠 생각하는 중… (위키 참조 후 계획 수립)");
      break;
    case "wiki":
      addEvent("📚 위키에서 과거 관찰 " + ev.chars + "자 로드");
      if (currentStatus) currentStatus.set("🧠 계획 수립 중… (과거 관찰 반영)");
      break;
    case "tool_call":
      addToolCall(ev.name, ev.args);
      if (currentStatus) currentStatus.tool(ev.name);
      break;
    case "tool_result":
      addToolResult(ev.name, ev.status, ev.preview);
      if (currentStatus) currentStatus.set("🧠 관찰 해석 중… (다음 단계 판단)");
      break;
    case "usage":
      if (!usageChip) usageChip = addEvent("");
      usageChip.textContent =
        "🔢 이번 턴 토큰: in " + fmtTk(ev.input_tokens) +
        " · out " + fmtTk(ev.output_tokens) +
        " · 합계 " + fmtTk(ev.total_tokens) +
        " (LLM 호출 " + (ev.llm_calls || 0) + "회)";
      updateContextUse(ev);
      break;
    case "final":
      if (currentStatus) currentStatus.set("✍️ 답변 작성 중…");
      renderAgent(ev.answer || "(답변 없음)", ev.turn_id);
      if (currentStatus) currentStatus.finish("✅ 완료");
      break;
    case "evolution":
      if (ev.lesson) addEvent("🧬 자가 진화 — 교훈 학습: " + ev.lesson);
      if (ev.proposal) addEvent("🧬 스킬 개선 제안 생성: " + ev.proposal + " (에이전트 편집기 ✎에서 검토·승인)");
      break;
    case "error":
      addEvent("⛔ " + ev.message).classList.add("error");
      break;
  }
}

document.getElementById("reflectBtn").addEventListener("click", async () => {
  if (!threadId) return;
  const waiting = addEvent("🧬 이 세션의 마지막 조사를 반성하는 중…");
  try {
    const res = await fetch("/api/sessions/" + threadId + "/reflect", { method: "POST" });
    const d = await res.json();
    waiting.remove();
    if (d.lesson) addEvent("🧬 교훈 학습: " + d.lesson);
    else addEvent("🧬 " + (d.note || d.error || "학습할 내용이 도출되지 않았습니다"));
    if (d.proposal_file) addEvent("🧬 스킬 개선 제안 생성: " + d.proposal_file + " (에이전트 편집기 ✎에서 검토·승인)");
  } catch (err) {
    waiting.remove();
    addEvent("⛔ 반성 실패: " + err.message).classList.add("error");
  }
});

// ---------- 슬래시 커맨드 (/compact, /clear, /help …) ----------
const SLASH_COMMANDS = [
  { cmd: "/compact", desc: "대화를 요약으로 압축해 컨텍스트 확보 (위키 기억은 유지)" },
  { cmd: "/clear", desc: "새 세션 시작 — 대화 컨텍스트 초기화" },
  { cmd: "/context", desc: "현재 컨텍스트 윈도우 사용량 보기" },
  { cmd: "/agents", desc: "사용 가능한 에이전트 목록" },
  { cmd: "/tools", desc: "사용 가능한 도구 목록" },
  { cmd: "/wiki", desc: "위키(장기 기억) 열기" },
  { cmd: "/meta", desc: "메타프롬프트 생성 — Claude 세션으로 인계" },
  { cmd: "/learn", desc: "이번 세션에서 교훈 학습(자가 진화)" },
  { cmd: "/help", desc: "사용 가능한 명령 보기" },
];

async function runSlash(raw) {
  const [cmd] = raw.trim().split(/\s+/);
  switch (cmd) {
    case "/help":
      addEvent("⌘ 사용 가능한 명령:\n" + SLASH_COMMANDS.map(c => `  ${c.cmd} — ${c.desc}`).join("\n"));
      return true;
    case "/clear":
      await newSession();
      return true;
    case "/context": {
      const pct = ((ctxUsed / ctxWindow) * 100).toFixed(1);
      addEvent(`📊 컨텍스트 윈도우: ${ctxUsed.toLocaleString()} / ${ctxWindow.toLocaleString()} 토큰 (${pct}%)`
        + (ctxUsed === 0 ? " — 아직 이번 세션에서 질의하지 않았습니다" : ""));
      return true;
    }
    case "/agents":
      addEvent("🤖 에이전트: " + agentDefs.map(a => a.name).join(", ") + "  (사이드바에서 선택)");
      return true;
    case "/tools":
      document.getElementById("toolsBox").open = true;
      addEvent("🛠 사용 가능한 도구 목록을 사이드바에 펼쳤습니다.");
      return true;
    case "/wiki":
      openWiki();
      return true;
    case "/meta":
      openMetaprompt();
      return true;
    case "/learn":
      document.getElementById("reflectBtn").click();
      return true;
    case "/compact": {
      if (!threadId) { addEvent("압축할 세션이 없습니다"); return true; }
      const waiting = addEvent("🗜 대화를 요약으로 압축하는 중…");
      try {
        const res = await fetch("/api/sessions/" + threadId + "/compact", { method: "POST" });
        const d = await res.json();
        waiting.remove();
        if (!res.ok) { addEvent("⛔ 압축 실패: " + (d.error || res.status)).classList.add("error"); return true; }
        if (!d.compacted) { addEvent("ℹ️ " + (d.note || "압축하지 않았습니다")); return true; }
        addEvent(`🗜 압축 완료 — 메시지 ${d.before_messages}개 → 2개 (위키 장기 기억은 유지)`);
        renderAgent("**압축 요약**\n\n" + d.summary);
        resetContextUse();
      } catch (err) {
        waiting.remove();
        addEvent("⛔ 압축 실패: " + err.message).classList.add("error");
      }
      return true;
    }
  }
  if (cmd.startsWith("/")) {
    addEvent("알 수 없는 명령: " + cmd + " — /help 로 목록을 보세요");
    return true;
  }
  return false;
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message || sendBtn.disabled) return;
  input.value = "";
  if (message.startsWith("/")) {
    el("div", "msg user", message);
    const handled = await runSlash(message);
    if (handled) { input.focus(); return; }
  }
  send(message);
});
// 슬래시 명령 자동완성 힌트
const slashHint = document.getElementById("slashHint");
function refreshSlashHint() {
  const v = input.value;
  if (!v.startsWith("/") || v.includes(" ")) { slashHint.hidden = true; return; }
  const matches = SLASH_COMMANDS.filter(c => c.cmd.startsWith(v));
  if (!matches.length) { slashHint.hidden = true; return; }
  slashHint.innerHTML = "";
  matches.forEach(c => {
    const row = document.createElement("div");
    row.className = "slashRow";
    const name = document.createElement("b"); name.textContent = c.cmd;
    const desc = document.createElement("span"); desc.textContent = c.desc;
    row.append(name, desc);
    row.addEventListener("mousedown", ev => {   // click 전에 발생 → blur 방지
      ev.preventDefault();
      input.value = c.cmd;
      slashHint.hidden = true;
      form.requestSubmit();
    });
    slashHint.appendChild(row);
  });
  slashHint.hidden = false;
}
input.addEventListener("input", refreshSlashHint);
input.addEventListener("blur", () => setTimeout(() => { slashHint.hidden = true; }, 150));

input.addEventListener("keydown", e => {
  if (e.key === "Tab" && !slashHint.hidden) {   // Tab 자동완성
    const first = slashHint.querySelector(".slashRow b");
    if (first) { e.preventDefault(); input.value = first.textContent; refreshSlashHint(); return; }
  }
  if (e.key === "Escape") { slashHint.hidden = true; return; }
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    slashHint.hidden = true;
    form.requestSubmit();
  }
});

(async () => {
  setThreadBadge();
  await loadAgents();
  if (threadId) await loadHistory();
  else await newSession();
  await refreshSessions();
  input.focus();
})();
